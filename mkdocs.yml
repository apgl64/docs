# Configuration MkDocs - Service du Numérique
site_name: "Service du Numérique"
site_description: "Portail de documentation technique et guide utilisateur - Agence Publique de Gestion Locale"
site_author: "Service du Numérique"

# Dossier des documentations Markdown
docs_dir: docs

theme:
  name: material
  language: fr
  logo: assets/images/logo-service.png
  favicon: assets/images/logo-service.png
  font:
    text: Roboto
    code: Roboto Mono
  palette:
    primary: custom
    accent: red
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit

extra:
  generator: false

extra_css:
  - assets/stylesheets/extra.css

copyright: |
  <div class="footer-apgl">
    <img src="/assets/images/logo-agence.png" alt="Logo APGL64" class="footer-apgl-logo" />
    <span class="footer-apgl-text">
      <a href="https://www.apgl64.fr" target="_blank" rel="noopener">Agence Publique de Gestion Locale (APGL 64)</a>
    </span>
  </div>

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true

nav:
  - Accueil: index.md
  - Guide Utilisateur TYPO3: Guide utilisateur TYPO3/index.md
